# PostgreSQL for reviewers only. Host port 5433 so a local server on 5432 does not clash.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailbox_manager
      POSTGRES_PASSWORD: mailbox_manager
      POSTGRES_DB: mailbox_manager_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mailbox_manager -d mailbox_manager_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
